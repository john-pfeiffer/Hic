name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: DSP core and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - name: Core must not include JUCE
        run: |
          if grep -rl "juce" dsp/; then echo "dsp/ must stay JUCE-free"; exit 1; fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render kit
        run: |
          if [ -x build/tests/render_kit ]; then build/tests/render_kit build/render; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: renders-${{ matrix.os }}
          path: build/render
          if-no-files-found: ignore

  plugin:
    name: JUCE plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libgl1-mesa-dev libfreetype-dev libx11-dev libfontconfig1-dev
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHIC_BUILD_PLUGIN=ON -DHIC_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build
      - name: Collect plugin bundles
        run: |
          mkdir -p dist
          cp -R build/plugin/Hic_artefacts/Release/VST3 dist/ 2>/dev/null || true
          cp -R build/plugin/Hic_artefacts/Release/AU dist/ 2>/dev/null || true
          cp -R build/plugin/Hic_artefacts/Release/Standalone dist/ 2>/dev/null || true
          ls -R dist | head -40
      - name: Ad-hoc sign and pack (macOS)
        if: runner.os == 'macOS'
        # Ad-hoc signing keeps Apple Silicon happy; the tarball keeps executable bits,
        # which GitHub's artifact zip would drop. After download run:
        #   tar xzf Hic-macos.tar.gz && xattr -cr VST3 AU Standalone
        run: |
          find dist -name "*.vst3" -o -name "*.component" -o -name "*.app" | while read b; do codesign --force --deep -s - "$b"; done
          tar czf Hic-macos.tar.gz -C dist .
          rm -rf dist && mkdir dist && mv Hic-macos.tar.gz dist/
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          tar czf Hic-linux.tar.gz -C dist .
          rm -rf dist && mkdir dist && mv Hic-linux.tar.gz dist/
      - uses: actions/upload-artifact@v5
        with:
          name: Hic-plugin-${{ matrix.os }}
          path: dist
          if-no-files-found: error
